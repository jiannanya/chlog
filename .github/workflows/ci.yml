name: Cross-platform C++20

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [std, fmt]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fmt source
        if: matrix.backend == 'fmt'
        run: git clone --depth 1 --branch 12.1.0 https://github.com/fmtlib/fmt.git build-fmt-source
      - name: Build and install fmt
        if: matrix.backend == 'fmt'
        run: |
          cmake -S build-fmt-source -B build-fmt-dependency -DCMAKE_BUILD_TYPE=Release -DFMT_TEST=OFF -DFMT_DOC=OFF -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build-dependencies
          cmake --build build-fmt-dependency --config Release --parallel 2
          cmake --install build-fmt-dependency --config Release
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DCHLOG_USE_FMT=${{ matrix.backend == 'fmt' && 'ON' || 'OFF' }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build-dependencies -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=ON
      - name: Build
        run: cmake --build build-ci --config Release --parallel 2
      - name: Test including installed package
        run: ctest --test-dir build-ci -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", thread]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCHLOG_BUILD_BENCHMARKS=OFF -DCHLOG_BUILD_EXAMPLES=OFF -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
